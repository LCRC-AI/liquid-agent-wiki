<!doctype html>
<html lang="{{ config.extra.docs_locale }}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 | Liquid Agent Docs</title>
<style>body{margin:10vh auto;padding:24px;max-width:620px;background:#fcfdfd;color:#163c46;font:18px/1.8 sans-serif}a{color:#17667a}h1{font-size:32px}</style>
<body>
<h1>{{ 'Page not found' if config.extra.docs_locale == 'en' else '\u672a\u627e\u5230\u6b64\u9875\u9762' }}</h1>
<p><a id="docs-home" href="./">{{ 'Open documentation' if config.extra.docs_locale == 'en' else '\u6253\u5f00\u6587\u6863\u9996\u9875' }}</a></p>
<script>
const marker = location.pathname.lastIndexOf('/docs/');
if (marker >= 0) document.getElementById('docs-home').href = location.pathname.slice(0, marker) + '/docs/';
</script>
</body></html>
